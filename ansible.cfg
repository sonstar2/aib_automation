[defaults]
collections_path=./collections
roles_path=./roles

[galaxy]
# Only the public server is queried by default so collections that don't need
# a Red Hat Automation Hub token (most of this repo) install without one and
# without noisy "Skipping Galaxy server" warnings from unauthenticated ah_*
# lookups. If you have an Automation Hub token, set it below and add
# ah_published/ah_validated to this list (or override with the
# ANSIBLE_GALAXY_SERVER_LIST env var), e.g.:
#   ANSIBLE_GALAXY_SERVER_LIST=galaxy,ah_published,ah_validated
server_list = galaxy

[galaxy_server.ah_published]
# Grab a token at https://console.redhat.com/ansible/automation-hub/token
# Then define it using ANSIBLE_GALAXY_SERVER_AH_PUBLISHED_TOKEN=""

url=https://console.redhat.com/api/automation-hub/content/published/
auth_url=https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
token=

[galaxy_server.ah_validated]
# Grab a token at https://console.redhat.com/ansible/automation-hub/token
# Then define it using ANSIBLE_GALAXY_SERVER_AH_VALIDATED_TOKEN=""

url=https://console.redhat.com/api/automation-hub/content/validated/
auth_url=https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
token=

[galaxy_server.galaxy]
url=https://galaxy.ansible.com/
